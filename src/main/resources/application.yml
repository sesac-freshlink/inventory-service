# inventory-service 기본 설정 (뼈대). 실제 값은 환경 변수나 Kubernetes Secret으로 넣는다.
# 프로필은 dev·prod 두 개. SPRING_PROFILES_ACTIVE로 고른다.
server:
  port: 8080

app:
  queue:
    commands: ${QUEUE_PREFIX:dev-}inventory-commands.fifo
    results: ${QUEUE_PREFIX:dev-}inventory-results
    # infra modules/messaging의 maxReceiveCount와 같게 둔다. 실패 로그에 "DLQ로 간다"를 붙일 때만 쓴다
    max-receive-count: ${QUEUE_MAX_RECEIVE_COUNT:3}
  expiry:
    cron: ${EXPIRY_CRON:0 0 0 * * *}
  store-stock:
    # 고객용 재고 조회 표에서 값이 맞는 시각이 지난 행을 다시 계산하는 간격. 그 사이 그 상품은 품절로 보인다
    refresh-delay-ms: ${STORE_STOCK_REFRESH_MS:60000}

freshlink:
  messaging:
    enabled: true

spring:
  application:
    name: inventory-service
  datasource:
    # dev·prod 모두 RDS. 주소는 환경 변수 DB_URL로 넣는다
    # IntelliJ에서 TestInventoryServiceApplication으로 실행하면 Docker MySQL이 대신 붙는다 (DB_URL 불필요)
    url: ${DB_URL:}
    username: ${DB_USERNAME:inventory_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul         # 시각은 ISO-8601 +09:00
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      sqs:
        observation-enabled: true        # 추적(할 일 16): 쪽지 속성 traceparent를 읽어 order의 traceId를 잇는다

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness
  # 추적(할 일 16). 요청마다 traceId를 만들어 로그에 넣고, 다른 서비스를 부를 때 traceparent 헤더를 붙인다.
  # PC에는 Zipkin이 없어서 보내지 않는다. 클러스터에서는 gitops 차트(spring-service)가 환경 변수로 켜고 주소를 넣는다:
  #   MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED=true, MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin.observability:9411/api/v2/spans
  # JSON 로그(LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs)도 차트가 넣는다. PC 로그는 사람이 읽는 형식 그대로다.
  tracing:
    sampling:
      probability: 1.0            # MVP는 요청이 적어 전부 기록
    export:
      zipkin:
        enabled: false

# Flyway: src/main/resources/db/migration/V1__xxx.sql 부터 이태우님이 채운다. 아직 파일이 없으면 경고만 찍고 지나간다.
